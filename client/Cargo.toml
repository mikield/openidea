# GPUI client: a separate workspace so the upstream root `Cargo.toml` /
# `Cargo.lock` stay untouched and `crates/` merges cleanly from upstream.
# Upstream crates are used read-only through path dependencies.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# upstream (read-only)
ide-core = { path = "../crates/ide-core" }
ide-jsonrpc = { path = "../crates/ide-jsonrpc" }
ide-host = { path = "../crates/ide-host" }
ide-language = { path = "../crates/ide-language" }
ide-tools = { path = "../crates/ide-tools" }
ide-dap = { path = "../crates/ide-dap" }
ide-sdk = { path = "../crates/ide-sdk" }

# internal
client-rpc = { path = "crates/client-rpc" }
client-core = { path = "crates/client-core" }

# GPUI as gpui-component pins it (a published snapshot of Zed's gpui), pinned exactly.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { version = "=0.8.1", features = ["syntect"] }
gpui-kit-assets = "=0.8.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
dirs = "6"

[profile.dev]
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
